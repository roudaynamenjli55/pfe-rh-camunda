server:
  port: 8081

# --- Configuration Camunda BPM ---
camunda:
  bpm:
    database:
      type: postgres
    filter:
      create: All
    generic-properties:
      job-execution-enabled: true
    admin-user:
      id: admin
      password: admin
      firstName: Admin
      lastName: Admin
    auto-deployment-enabled: true
    deployment:
      resource-pattern: classpath*:processes/*.bpmn

# --- Configuration Spring Boot ---
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sirhdb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

  # --- Sécurité OAuth2 / Keycloak ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/rhcamunda-realm
          jwk-set-uri: http://localhost:8080/realms/rhcamunda-realm/protocol/openid-connect/certs

  # --- Spring AI (Chatbot RH via OpenRouter) ---
  ai:
    openai:
      api-key: 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 # Variable d'env — jamais en clair dans les sources
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: openai/gpt-4o-mini        # Bon rapport qualité/prix pour usage interne
          temperature: 0.3
          max-tokens: 1000

  # --- Redis (historique de conversation chatbot) ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# --- Logs ---
logging:
  level:
    root: INFO
    org.springframework.boot: INFO
    org.springframework.security: DEBUG
    org.springframework.ai: INFO
    org.example.rhcamunda.service.chatbot: DEBUG
    org.camunda: WARN
    org.camunda.bpm.engine: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE