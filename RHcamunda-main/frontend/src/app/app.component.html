<div class="app-container" [class.logged-in]="isLoggedIn">
  
  <!-- Sidebar Navigation -->
  <nav class="sidebar" *ngIf="isLoggedIn">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">🏦</span>
        <span class="logo-text">BanqueRH</span>
      </div>
      <p class="subtitle">Portail Employé</p>
    </div>
    
    <div class="nav-section">
      <span class="section-title">PRINCIPAL</span>
      <a routerLink="/conges/mes-conges" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📋</span><span class="nav-label">Mes Congés</span>
      </a>
      <a routerLink="/conges/nouvelle-demande" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">➕</span><span class="nav-label">Nouvelle Demande</span>
      </a>
      <a routerLink="/conges/titre-conge" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🎫</span><span class="nav-label">Titre de Congé</span>
      </a>
    </div>

    <div class="nav-section">
      <span class="section-title">SUIVI</span>
      <a routerLink="/conges/historique" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📜</span><span class="nav-label">Historique</span>
      </a>
      <a routerLink="/profil-employe" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">👤</span><span class="nav-label">Profil Employé</span>
      </a>
    </div>

    <div class="nav-footer">
      <a (click)="logout()" class="nav-item logout">
        <span class="nav-icon">🚪</span><span class="nav-label">Déconnexion</span>
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
